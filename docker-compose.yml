# The whole application, from nothing to a browsable dashboard:
#
#     docker compose up
#
#   frontend   :5697  the React/AntD client — nginx, and the API on the same
#                     origin, so the bundle has no API URL compiled into it
#   app        :5696  the 7 Kafka workers AND the HTTP API in one process
#   postgres   :5434  every analysed record, written by W7
#   pgadmin    :5050  a SQL window onto it, pre-registered
#   kafka      :9094  + kafka-ui   :8083
#   redis      :6379  + redisinsight :5540
#
# The five AI services (face-match-main :8821, video-describe-354b :8822,
# video-ocr :8823, transcribe :8824, summarize :8825) are NOT defined here —
# they run on their own host, reached over HTTP at the AI_*_URL values in .env.
# Set MOCK_WORKER_<NAME>=True to run this whole stack without them, which is
# also how the client app gets something to show on a laptop.
#
# Ordering: `app` waits for Kafka, Redis and PostgreSQL to be **healthy**, not
# merely started — a container that is running is not a database accepting
# connections, and `depends_on` without a condition only promises the former.

networks:
  pipenet:

volumes:
  kafka-data: {}
  redisinsight-data: {}
  postgres-data: {}
  pgadmin-data: {}

services:

  kafka:
    image: apache/kafka:3.9.0
    container_name: video-kafka
    networks: [pipenet]
    ports:
      # Host port is configurable — see PORT_* in .env. Container side is fixed.
      - "${PORT_KAFKA:-9094}:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # A transcript, and especially an OCR response with one text block per
      # sampled frame, go well past Kafka's 1 MB default.
      KAFKA_MESSAGE_MAX_BYTES: "20971520"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "20971520"
      KAFKA_SOCKET_REQUEST_MAX_BYTES: "20971520"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: video-kafka-ui
    networks: [pipenet]
    depends_on: [kafka]
    ports:
      - "${PORT_KAFKA_UI:-8083}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_MAX_REQUEST_SIZE: "20971520"

  redis:
    image: redis:7-alpine
    container_name: video-redis
    networks: [pipenet]
    ports:
      - "${PORT_REDIS:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-insight:
    image: redis/redisinsight:latest
    container_name: video-redis-insight
    networks: [pipenet]
    depends_on: [redis]
    ports:
      - "${PORT_REDIS_INSIGHT:-5540}:5540"
    environment:
      # Pre-register the pipeline's Redis, so the UI opens straight on it.
      RI_REDIS_HOST: "redis"
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: "video-pipeline-redis"
    volumes:
      - redisinsight-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: video-postgres
    networks: [pipenet]
    ports:
      - "${PORT_POSTGRES:-5434}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-video}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-video}"
      POSTGRES_DB: "${POSTGRES_DB:-video_analysis}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-video} -d ${POSTGRES_DB:-video_analysis}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: video-pgadmin
    networks: [pipenet]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT_PGADMIN:-5050}:80"
    environment:
      # A dot in the domain is not optional: pgAdmin validates the address at
      # boot and exits when it fails, which looks like a crash loop.
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@local.dev}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-admin}"
      # It is a development tool on a private network; the master-password
      # prompt on every open is friction with nothing behind it.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # The pipeline's database, pre-registered: open pgAdmin and the server is
      # already in the tree (the password is still typed once, by design).
      - ./maps/pgadmin-servers.json:/pgadmin4/servers.json:ro
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-app
    networks: [pipenet]
    # Run as the host user, so the records W7 writes into ./output are owned by
    # you and not by root. Override with DOCKER_UID/DOCKER_GID if your ids
    # differ (`id -u` / `id -g`).
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${PORT_API:-5696}:5000"
    # Every AI_*_URL, MOCK_WORKER_*, prompt and output setting comes straight
    # from .env — edit it and `docker compose up -d app` to apply.
    env_file:
      - .env
    environment:
      # Container-network overrides for the two .env values that differ inside
      # Docker. Everything else is inherited from env_file above.
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      API_HOST: "0.0.0.0"
      API_PORT: "5000"
      # W7 writes here: /app/output -> ./output on the host.
      OUTPUT_DIR: "/app/output"
      # …and here. The host port differs (PORT_POSTGRES), the container one
      # never does, which is why this is an override rather than an .env value.
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@postgres:5432/${POSTGRES_DB:-video_analysis}"
      # Where a submitted path is looked up when the video is mounted below.
      VIDEO_SEARCH_DIRS: "/app/videos:/app/VIDEOS:/app/data"
    volumes:
      # Drop a video in ./videos and submit it as /app/videos/<name>.mp4 —
      # or submit the AI host's own path and leave this empty.
      - ./videos:/app/videos:ro
      # The sample corpus that ships with the project.
      - ../VIDEOS:/app/VIDEOS:ro
      - ./data:/app/data:ro
      # The application code. The image already contains it (see the Dockerfile),
      # so this mount is purely so that editing a worker, a prompt or a client
      # endpoint takes effect with `docker compose restart app` instead of a
      # rebuild. Drop this one line to run exactly what was built.
      - ./src:/app/src:ro
      # Registered endpoints. Same reason: adding a route is a restart, not a
      # rebuild.
      - ./maps:/app/maps:ro
      # W7 writes one <video name>_analysis.json per run here. Bind-mounted, so
      # every record is readable on the host at ./output/ as it is produced.
      - ./output:/app/output

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: video-frontend
    networks: [pipenet]
    depends_on: [app]
    ports:
      - "${PORT_FRONTEND:-5697}:80"
    environment:
      # nginx proxies /client, /pipeline, /workers and /swagger.json to the API
      # over the compose network, so the browser only ever talks to one origin
      # and no API URL is compiled into the bundle.
      CLIENT_API_UPSTREAM: "app:5000"
      CLIENT_DNS_RESOLVER: "127.0.0.11"
    restart: unless-stopped

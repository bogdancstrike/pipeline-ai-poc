      <text x="864" y="166" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">5 containers</text>

      <rect x="936" y="136" width="464" height="456" rx="8" fill="#eb6c36" fill-opacity="0.05" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="952" y="166" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AI HOST · 172.17.12.80</text>
      <text x="1384" y="166" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">NOT IN COMPOSE</text>


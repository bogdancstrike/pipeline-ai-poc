      <text x="128" y="295" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">curl · submit_video.py</text>
      <text x="128" y="313" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reads ./output</text>

      <!-- Node: kafka -->
      <rect x="304" y="184" width="224" height="80" rx="6" fill="#f5f5f5"/>

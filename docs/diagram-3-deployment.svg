      <text x="416" y="283" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST :5000 /analyze</text>

      <rect x="532" y="202" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="211" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">12 topics</text>

      <rect x="532" y="338" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="347" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">agg × 2</text>


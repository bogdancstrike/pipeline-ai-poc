      <text x="332" y="337" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">:6379</text>
      <text x="416" y="366" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">redis</text>
      <text x="416" y="381" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aggregator buffers</text>

      <!-- Node: web UIs -->
      <rect x="304" y="448" width="224" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="448" width="224" height="80" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>

      <text x="416" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kafka-ui · RedisInsight</text>
      <text x="416" y="509" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8081 · :5540</text>

      <!-- Node: the app (focal) -->
      <rect x="592" y="192" width="256" height="336" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="192" width="256" height="336" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="600" y="200" width="32" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="616" y="209" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="840" y="209" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">python app.py</text>
      <text x="720" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">video-app</text>
      <text x="720" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ETL thread + Flask :5000</text>

      <line x1="608" y1="276" x2="832" y2="276" stroke="#eb6c36" stroke-opacity="0.25" stroke-width="0.8"/>
      <text x="616" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">W1  splitter</text>
      <text x="616" y="311" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">W2  face-match-main</text>
      <text x="616" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">W3  video-describe-354b</text>
      <text x="616" y="341" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">W4  transcribe</text>
      <text x="616" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">W5  video-ocr</text>
      <text x="616" y="371" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">W6  aggregator + AI caller</text>
      <text x="616" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">W7  aggregator</text>

      <line x1="608" y1="404" x2="832" y2="404" stroke="#eb6c36" stroke-opacity="0.25" stroke-width="0.8"/>
      <text x="616" y="424" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BIND MOUNTS</text>
      <text x="616" y="442" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">./output  → /app/output</text>
      <text x="616" y="457" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">./videos  → /app/videos</text>
      <text x="616" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">../VIDEOS → /app/VIDEOS</text>
      <text x="616" y="496" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">runs as your uid:gid, so</text>
      <text x="616" y="511" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">records are yours on the host</text>

      <!-- Nodes: the five AI services -->
      <rect x="968" y="192" width="400" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="968" y="192" width="400" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>

      <text x="1168" y="562" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Each one resolves the submitted path on its own filesystem.</text>
      <text x="576" y="562" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">All of this comes up with one docker compose up.</text>


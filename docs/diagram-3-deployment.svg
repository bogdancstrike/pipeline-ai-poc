      <rect x="312" y="192" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="332" y="201" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">:9094</text>
      <text x="416" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kafka</text>
      <text x="416" y="245" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">20 MB max message</text>

      <!-- Node: redis -->
      <rect x="304" y="320" width="224" height="80" rx="6" fill="#f5f5f5"/>

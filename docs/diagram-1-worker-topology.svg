<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-1-worker-topology-title diagram-1-worker-topology-desc">
      <title id="diagram-1-worker-topology-title">Video analysis pipeline — worker topology</title>
      <desc id="diagram-1-worker-topology-desc">Seven QF workers wired by eleven Kafka topics: a splitter turns one submitted video path into four parallel extraction branches, each calling one AI service. Three of them — description, transcription and OCR — meet in a Redis-backed aggregator that folds what is visible into a single titled video_description string and prompts the summary service three times. The fourth, face matching, produces identity rather than prose, so it bypasses that stage and reports straight to the final aggregator, which joins the two halves, prints one record per video and writes it to output/.</desc>
      <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Stage rail -->
      <text x="40" y="72" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SUBMIT</text>
      <text x="264" y="72" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SPLIT</text>
      <text x="512" y="72" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em">EXTRACT</text>
      <text x="792" y="72" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MERGE + PROMPT</text>
      <text x="1088" y="72" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AGGREGATE</text>
      <text x="1360" y="72" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em">OUTPUT</text>

      <!-- Arrows (before boxes) -->
      <line x1="168" y1="324" x2="264" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- W1 fans the path out to four extraction branches -->
      <path d="M 416,296 H 424 Q 432,296 432,288 V 200 Q 432,192 440,192 H 512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 416,312 H 440 Q 448,312 448,304 V 288 Q 448,280 456,280 H 512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 416,328 H 472 Q 480,328 480,336 V 360 Q 480,368 488,368 H 512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 416,344 H 456 Q 464,344 464,352 V 448 Q 464,456 472,456 H 512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- the three content branches converge on the AI caller -->
      <line x1="696" y1="280" x2="792" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="696" y1="368" x2="792" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="696" y1="456" x2="792" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- W2 bypasses the AI caller entirely: identity goes straight to the record -->
      <path d="M 604,160 V 120 Q 604,112 612,112 H 1168 Q 1176,112 1176,120 V 272" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>

      <line x1="992" y1="324" x2="1088" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1264" y1="324" x2="1360" y2="324" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels (topic names) -->
      <rect x="200" y="302" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="216" y="311" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">in</text>

      <rect x="700" y="258" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="744" y="267" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">merge.describe</text>

      <rect x="700" y="346" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="744" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">merge.transcribe</text>

      <rect x="700" y="434" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="744" y="443" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">merge.ocr</text>

      <rect x="716" y="90" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="99" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">agg.face</text>

      <rect x="1016" y="302" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1040" y="311" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">agg.ai</text>

      <rect x="1292" y="302" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1312" y="311" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">done</text>

      <!-- Node: submitted video -->
      <rect x="40" y="288" width="128" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="288" width="128" height="72" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="296" width="28" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="62" y="305" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="104" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Video path</text>
      <text x="104" y="343" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /analyze</text>

      <!-- Node: W1 splitter -->
      <rect x="264" y="280" width="152" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="280" width="152" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="272" y="288" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="286" y="297" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">W1</text>
      <text x="408" y="297" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">video.in</text>
      <text x="340" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">splitter</text>
      <text x="340" y="339" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fan-out × 4</text>

      <!-- Node: W2 face-match-main -->
      <rect x="512" y="160" width="184" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="160" width="184" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="520" y="168" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="534" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">W2</text>
      <text x="688" y="177" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">face.in</text>
      <text x="604" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">face-match-main</text>
      <text x="604" y="211" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8821 /match</text>
      <text x="604" y="222" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">identity — skips W6</text>

      <!-- Node: W3 video-describe-354b -->
      <rect x="512" y="248" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="248" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="520" y="256" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="534" y="265" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">W3</text>
      <text x="688" y="265" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">describe.in</text>
      <text x="604" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">video-describe-354b</text>
      <text x="604" y="301" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8822 /describe</text>

      <!-- Node: W4 transcribe -->
      <rect x="512" y="336" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="336" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="520" y="344" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="534" y="353" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">W4</text>
      <text x="688" y="353" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">transcribe.in</text>
      <text x="604" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">transcribe</text>
      <text x="604" y="389" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8824 /transcribe</text>

      <!-- Node: W5 video-ocr -->
      <rect x="512" y="424" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="424" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="520" y="432" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="534" y="441" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">W5</text>
      <text x="688" y="441" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">ocr.in</text>
      <text x="604" y="462" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">video-ocr</text>
      <text x="604" y="477" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8823 /ocr</text>

      <!-- Node: W6 aggregator + AI caller (focal) — the three content branches only -->
      <rect x="792" y="240" width="200" height="256" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="240" width="200" height="256" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="800" y="248" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="814" y="257" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">W6</text>
      <text x="984" y="257" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">3 branches</text>
      <text x="892" y="343" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">aggregator + AI caller</text>
      <text x="892" y="363" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8825 /summarize × 3</text>
      <text x="892" y="378" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">summary · entities · sentiment</text>
      <text x="892" y="393" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">builds video_description</text>

      <!-- Node: W7 aggregator (focal) -->
      <rect x="1088" y="272" width="176" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="1088" y="272" width="176" height="104" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="1096" y="280" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="1110" y="289" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">W7</text>
      <text x="1176" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">aggregator</text>
      <text x="1176" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">merges face + ai</text>
      <text x="1176" y="349" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">console + JSON file</text>

      <!-- Node: the record -->
      <rect x="1360" y="264" width="200" height="120" rx="6" fill="#f5f5f5"/>
      <rect x="1360" y="264" width="200" height="120" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="1368" y="272" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="1384" y="281" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="1460" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Aggregated record</text>
      <text x="1460" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">console + output/*.json</text>
      <text x="1460" y="345" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every field + raw bodies</text>

      <!-- Legend -->
      <line x1="40" y1="528" x2="1560" y2="528" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <text x="1560" y="544" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">every topic name is prefixed video.</text>

      <rect x="40" y="564" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="60" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Submitted video</text>

      <rect x="280" y="564" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Worker (one AI call)</text>

      <rect x="560" y="564" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="580" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Aggregator (Redis, by id)</text>

      <rect x="880" y="564" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="900" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Output record</text>

      <line x1="1140" y1="570" x2="1168" y2="570" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="1176" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Kafka topic</text>

      <line x1="1320" y1="570" x2="1348" y2="570" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <text x="1356" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Identity, straight to the record</text>
</svg>

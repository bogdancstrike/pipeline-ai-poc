[pytest]
# `src` so the pipeline modules import under the names the framework expects
# (`from config import Config`); `tests` so the shared corpus and live-stack
# helpers import as `support.*` from every suite.
pythonpath = src tests
testpaths = tests
python_files = test_*.py
markers =
    integration: needs Kafka + Redis running (docker compose up -d kafka redis)
    live: needs the whole stack up and answering on API_BASE (docker compose up -d)
    perf: measures how long something takes, and fails when it takes too long
    load: drives concurrent traffic at the running stack
addopts = -v --tb=short

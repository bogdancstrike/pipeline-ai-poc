# The client app, with the API on the same origin.
#
# Same-origin is the point. The bundle calls `/client/...` relative, so the
# browser never issues a cross-origin request, there is no preflight on every
# call, and no API URL is compiled into the JavaScript — the same image runs
# anywhere and only CLIENT_API_UPSTREAM changes.
#
# Rendered by nginx's official entrypoint from /etc/nginx/templates, which
# substitutes only names present in the environment, so nginx's own
# `$request_uri` and friends survive untouched.

# An upstream written literally into proxy_pass is resolved once, at startup:
# a frontend that starts a moment before the API is in DNS then exits with
# "host not found in upstream". Putting the host in a variable defers the
# lookup to request time, which needs a resolver. 127.0.0.11 is Docker's
# embedded DNS on every user-defined network.
resolver ${CLIENT_DNS_RESOLVER} valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ── The API ───────────────────────────────────────────────────────────
    # /client/  — the explorer, dashboard, statistics and saved searches
    # /pipeline/, /workers/ — the pipeline's own endpoints, so the UI can submit
    #            a video and read the wiring without a second origin
    # /swagger.json — Flask-RESTX's spec, behind the same door
    #
    # The trailing slash is load-bearing. Without it this matched the bare
    # `/pipeline`, which is a *client* route — so the Pipeline page worked when
    # it was navigated to and answered 404 from the API when it was reloaded or
    # opened from a bookmark. Every real API path has a segment after the
    # namespace; the namespace on its own belongs to the SPA fallback below.
    location ~ ^/(client|pipeline|workers)/|^/swagger\.json$ {
        set $client_api ${CLIENT_API_UPSTREAM};
        proxy_pass http://$client_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A cold model on a long video keeps a /workers/*/run call open for
        # minutes; AI_TIMEOUT_SEC defaults to 600.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # An export is streamed; buffering it into one lump defeats that.
        proxy_buffering off;
    }

    # ── Static assets ─────────────────────────────────────────────────────
    # Hashed filenames, so they can be cached forever. index.html cannot be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    # Every unmatched path is a client route: a deep link has to work when it
    # is pasted, not only when it is navigated to.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
